services:
  orqiva:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${ORQIVA_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/orqiva.db
      PORT: 3001
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:?Set a unique SEED_PASSWORD in .env before starting}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - orqiva-data:/app/data
      - orqiva-backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  orqiva-data:
  orqiva-backups:
